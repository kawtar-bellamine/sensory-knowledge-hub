[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sensory-knowledge-hub"
version = "1.0.0"
description = "Connected sensory and consumer data: dashboards, preference mapping, recipe models and a traceable search assistant"
authors = [{ name = "Abderrahmane BOULAMI" }, { name = "Kawtar BELLAMINE" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "streamlit>=1.51",
    "altair>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
convert = ["pyreadr>=0.5"]

[tool.setuptools]
packages = ["sensehub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
